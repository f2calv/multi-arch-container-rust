[package]
name = "multi-arch-container-rust"
authors = ["Alex Vincent <alex@far2cool.com>"]
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Layered configuration (file -> environment), the Rust analogue of Microsoft.Extensions.Configuration.
config = { version = "0.15", default-features = false, features = ["json"] }
opentelemetry = { version = "=0.32.0", default-features = false, features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = { version = "=0.32.0", default-features = false }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = [
    "http-proto",
    "logs",
    "metrics",
    "reqwest-blocking-client",
    "reqwest-rustls-webpki-roots",
    "trace",
] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = [
    "logs",
    "metrics",
    "trace",
] }
serde = { version = "1", features = ["derive"] }
# Structured, levelled logging - the Rust analogue of Serilog.
tracing = "0.1"
tracing-opentelemetry = { version = "=0.33.0", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Note: the 'termination' feature also traps SIGTERM, which is what Docker/Kubernetes send on shutdown.
ctrlc = { version = "3", features = ["termination"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
