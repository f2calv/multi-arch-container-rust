[package]
name = "multi-arch-container-rust"
authors = ["Alex Vincent <alex@far2cool.com>"]
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Layered configuration (file -> environment), the Rust analogue of Microsoft.Extensions.Configuration.
config = "0"
serde = { version = "1", features = ["derive"] }
# Structured, levelled logging - the Rust analogue of Serilog.
tracing = "0"
tracing-subscriber = { version = "0", features = ["env-filter", "json"] }
# Note: the 'termination' feature also traps SIGTERM, which is what Docker/Kubernetes send on shutdown.
ctrlc = { version = "3", features = ["termination"] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
